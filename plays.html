<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>نمایشنامه‌ها — کانون تئاتر دانشگاه نیشابور</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --night:#0E1B24;
    --night-2:#162A35;
    --turquoise:#3FBFB6;
    --turquoise-deep:#1B7E79;
    --ochre:#D9A62E;
    --paper:#F0ECE3;
    --ink:#1A242C;
    --ink-soft:#54636E;
    --rule:#D8D1C4;

    --bg:var(--paper);
    --fg:var(--ink);
    --fg-soft:var(--ink-soft);
    --panel:#FFFFFF;
    --line:var(--rule);
    --accent:var(--turquoise-deep);
    --accent-2:#9C7413;

    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#111A21;
      --fg:#E7E2D7;
      --fg-soft:#9BA9B2;
      --panel:#17232B;
      --line:#2A3A44;
      --accent:var(--turquoise);
      --accent-2:var(--ochre);
    }
  }
  :root[data-theme="dark"]{
    --bg:#111A21;--fg:#E7E2D7;--fg-soft:#9BA9B2;--panel:#17232B;--line:#2A3A44;
    --accent:var(--turquoise);--accent-2:var(--ochre);
  }
  *,*::before,*::after{box-sizing:inherit}
  html{scroll-padding-top:calc(4.2rem + env(safe-area-inset-top,0px));-webkit-text-size-adjust:100%;height:100%}
  body{
    margin:0;min-height:100%;
    background:var(--bg);color:var(--fg);
    font-family:Vazirmatn,"Segoe UI",Tahoma,sans-serif;
    font-size:17px;line-height:1.85;
  }
  a{color:inherit}
  .wrap{max-width:46rem;margin:0 auto;padding:0 1.25rem}

  /* ---------- نوار بالا ---------- */
  .topbar{
    position:sticky;top:0;z-index:40;
    padding-top:env(safe-area-inset-top,0px);
    background:var(--night);
    border-bottom:1px solid rgba(63,191,182,.35);
  }
  .topbar-inner{
    max-width:46rem;margin:0 auto;padding:0 1.1rem;
    height:3.6rem;display:flex;align-items:center;justify-content:space-between;
  }
  .brand{
    display:flex;align-items:center;gap:.55rem;
    text-decoration:none;color:#EAF4F3;
  }
  .brand .mark{
    width:1.9rem;height:1.9rem;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, var(--turquoise), var(--turquoise-deep) 70%);
    flex:none;
    box-shadow:inset 0 0 0 2px rgba(255,255,255,.15);
  }
  .brand span{
    font-family:Lalezar,sans-serif;font-size:1.25rem;line-height:1;
    letter-spacing:.01em;
  }
  .burger{
    appearance:none;border:0;background:transparent;
    width:2.6rem;height:2.6rem;border-radius:.5rem;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
    cursor:pointer;
  }
  .burger:hover{background:rgba(63,191,182,.12)}
  .burger span{
    width:22px;height:2px;background:var(--turquoise);border-radius:2px;
    transition:transform .25s ease, opacity .2s ease;
  }
  .burger[aria-expanded="true"] span:nth-child(1){transform:translateY(7px) rotate(45deg)}
  .burger[aria-expanded="true"] span:nth-child(2){opacity:0}
  .burger[aria-expanded="true"] span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}

  .backdrop{
    position:fixed;
    top:calc(3.6rem + env(safe-area-inset-top,0px));
    left:0;right:0;bottom:0;
    background:rgba(0,0,0,.4);
    opacity:0;pointer-events:none;
    transition:opacity .25s ease;
    z-index:38;
  }
  .backdrop[data-open="true"]{opacity:1;pointer-events:auto}

  #menu{
    position:fixed;
    top:calc(3.6rem + env(safe-area-inset-top,0px));
    bottom:0;left:0;
    width:min(78vw, 16rem);
    background:var(--night-2);
    border-left:1px solid rgba(63,191,182,.15);
    box-shadow:2px 0 18px rgba(0,0,0,.25);
    transform:translateX(-100%);
    transition:transform .28s ease;
    overflow-y:auto;
    z-index:39;
  }
  #menu[data-open="true"]{transform:translateX(0)}
  #menu ul{list-style:none;margin:0;padding:.6rem 0}
  #menu li a{
    display:block;padding:.9rem 1.1rem;color:#DCEFED;text-decoration:none;
    font-size:1.02rem;border-bottom:1px solid rgba(255,255,255,.06);
  }
  #menu li:last-child a{border-bottom:none}
  #menu li a[aria-current="page"]{color:var(--turquoise);font-weight:600}
  #menu li a:hover{color:var(--turquoise)}

  /* ---------- سردَر کوچک‌تر برای صفحه‌ی داخلی ---------- */
  header.hero{
    background:var(--night);color:#EAF4F3;
    padding:2.6rem 0 2.6rem;position:relative;overflow:hidden;
    border-bottom:6px solid var(--turquoise-deep);
  }
  .tile{
    position:absolute;inset:0;
    background-image:
      linear-gradient(45deg, rgba(63,191,182,.10) 25%, transparent 25%, transparent 75%, rgba(63,191,182,.10) 75%),
      linear-gradient(45deg, rgba(217,166,46,.08) 25%, transparent 25%, transparent 75%, rgba(217,166,46,.08) 75%);
    background-size:72px 72px;background-position:0 0,36px 36px;opacity:.9;
  }
  .hero .wrap{position:relative}
  .eyebrow{color:var(--ochre);font-size:.92rem;margin:0 0 .5rem}
  h1{
    font-family:Lalezar,Vazirmatn,sans-serif;font-weight:400;
    font-size:clamp(2rem,8vw,3rem);line-height:1.15;margin:0;
    color:var(--turquoise);text-shadow:0 2px 0 rgba(0,0,0,.35);
  }
  .hero p.sub{margin:.8rem 0 0;font-size:1.02rem;color:#BFD6D4;max-width:30rem}

  main{padding:2.8rem 0 4rem}
  section{margin:0 0 2.6rem}
  p{margin:0 0 1rem}

  /* ---------- کارت نمایشنامه ---------- */
  .play-list{display:grid;gap:1.4rem}
  .play-card{
    background:var(--panel);border:1px solid var(--line);
    border-right:4px solid var(--accent);
    padding:1.3rem 1.3rem 1.4rem;
  }
  .play-card h2{
    font-family:Lalezar,Vazirmatn,sans-serif;font-weight:400;
    font-size:1.6rem;margin:0 0 .35rem;color:var(--accent);
  }
  .meta{
    display:flex;flex-wrap:wrap;gap:.4rem .5rem;margin:0 0 .8rem;padding:0;list-style:none;
  }
  .meta li{
    border:1px solid var(--line);color:var(--fg-soft);
    font-size:.82rem;padding:.22rem .6rem;border-radius:999px;
  }
  .play-card p{color:var(--fg-soft)}
  .play-card p:last-of-type{margin-bottom:1rem}
  .cta{
    display:inline-flex;align-items:center;gap:.5rem;
    background:var(--turquoise-deep);color:#F4FBFA;
    text-decoration:none;padding:.65rem 1.2rem;
    font-size:.95rem;border-radius:.4rem;
    transition:background .18s ease;
  }
  .cta:hover{background:var(--turquoise)}

  .empty{
    border:1px dashed var(--line);
    padding:1.6rem 1.3rem;
    color:var(--fg-soft);
    font-size:.96rem;
    text-align:center;
  }
  .state-msg{
    display:flex;align-items:center;justify-content:center;gap:.6rem;
    border:1px dashed var(--line);
    padding:1.8rem 1.3rem;
    color:var(--fg-soft);
    font-size:.96rem;
  }
  .state-msg .dot{
    width:.55rem;height:.55rem;border-radius:50%;
    background:var(--accent);flex:none;
    animation:pulse 1s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{opacity:.35;transform:scale(.85)}
    50%{opacity:1;transform:scale(1)}
  }
  .state-msg.is-error{border-color:#C0524A;color:#C0524A}
  .state-msg.is-error .dot{display:none}

  footer{
    border-top:1px solid var(--line);
    padding:1.6rem 0 calc(2.2rem + env(safe-area-inset-bottom,0px));
    color:var(--fg-soft);font-size:.88rem;
  }
  :focus-visible{outline:3px solid var(--turquoise);outline-offset:2px}
  @media (prefers-reduced-motion: reduce){
    .burger span,#menu,.backdrop,.state-msg .dot{transition:none;animation:none}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="index.html">
      <span class="mark" aria-hidden="true"></span>
      <span>کانون تئاتر نیشابور</span>
    </a>
    <button class="burger" id="burgerBtn" aria-expanded="false" aria-controls="menu" aria-label="باز کردن منو">
      <span></span><span></span><span></span>
    </button>
  </div>
  <nav id="menu" data-open="false">
    <ul>
      <li><a href="index.html">خانه</a></li>
      <li><a href="plays.html" aria-current="page">نمایشنامه‌ها</a></li>
    </ul>
  </nav>
</div>
<div class="backdrop" id="backdrop" data-open="false"></div>

<header class="hero">
  <div class="tile" aria-hidden="true"></div>
  <div class="wrap">
    <p class="eyebrow">آرشیو کانون</p>
    <h1>نمایشنامه‌ها</h1>
    <p class="sub">متن‌هایی که تا امروز نوشته‌ایم یا در حال نوشتنشون هستیم.</p>
  </div>
</header>

<main class="wrap">
  <section>
    <div class="play-list" id="playList">
      <div class="state-msg" id="stateMsg">
        <span class="dot" aria-hidden="true"></span>
        <span>در حال بارگذاری نمایشنامه‌ها…</span>
      </div>
    </div>
  </section>
</main>

<footer class="wrap">
  <p>کانون تئاتر دانشگاه نیشابور</p>
</footer>

<script>
  (function(){
    var btn = document.getElementById('burgerBtn');
    var menu = document.getElementById('menu');
    var backdrop = document.getElementById('backdrop');
    function setOpen(open){
      menu.setAttribute('data-open', String(open));
      backdrop.setAttribute('data-open', String(open));
      btn.setAttribute('aria-expanded', String(open));
    }
    btn.addEventListener('click', function(){
      setOpen(menu.getAttribute('data-open') !== 'true');
    });
    backdrop.addEventListener('click', function(){ setOpen(false); });
    document.addEventListener('keydown', function(e){
      if(e.key === 'Escape'){ setOpen(false); }
    });
  })();

  /* ---------- بارگذاری نمایشنامه‌ها از Supabase ----------
     پیش از استفاده، سه مقدار زیر را با اطلاعات پروژه‌ی خودتان پر کنید.
     SUPABASE_URL و SUPABASE_ANON_KEY را از Project Settings → API بردارید
     (کلید anon/public را بگذارید، نه service_role را).
  */
  (function(){
    var SUPABASE_URL = "https://giskluyvwinuyqlgdfuw.supabase.co";
    var SUPABASE_ANON_KEY = "sb_publishable_rInivX8hSrSzWNEeMiMbsw_cNEyJxrh";
    var TABLE_NAME = "plays";

    var listEl = document.getElementById('playList');
    var stateEl = document.getElementById('stateMsg');

    function escapeHtml(str){
      return String(str == null ? "" : str).replace(/[&<>"']/g, function(c){
        return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
      });
    }

    function renderPlays(plays){
      if(!plays || plays.length === 0){
        stateEl.className = "empty";
        stateEl.innerHTML = "نمایشنامه‌ی بعدی، در دست نوشتن است.";
        return;
      }
      stateEl.remove();
      plays.forEach(function(play){
        var article = document.createElement('article');
        article.className = "play-card";

        var metaHtml = "";
        if(Array.isArray(play.meta) && play.meta.length){
          metaHtml = '<ul class="meta">' +
            play.meta.map(function(m){ return '<li>' + escapeHtml(m) + '</li>'; }).join('') +
            '</ul>';
        }

        var linkHtml = "";
        if(play.link_url){
          linkHtml = '<a class="cta" href="' + escapeHtml(play.link_url) +
            '" target="_blank" rel="noopener">خواندن متن کامل ←</a>';
        }

        article.innerHTML =
          '<h2>' + escapeHtml(play.title) + '</h2>' +
          metaHtml +
          '<p>' + escapeHtml(play.summary) + '</p>' +
          linkHtml;

        listEl.appendChild(article);
      });
    }

    function showError(){
      stateEl.className = "state-msg is-error";
      stateEl.innerHTML = "<span>نمایشنامه‌ها لود نشدن. لطفاً بعداً دوباره امتحان کنید.</span>";
    }

    var endpoint = SUPABASE_URL + "/rest/v1/" + TABLE_NAME +
      "?select=*&published=eq.true&order=sort_order.asc";

    fetch(endpoint, {
      headers: {
        apikey: SUPABASE_ANON_KEY,
        Authorization: "Bearer " + SUPABASE_ANON_KEY
      }
    })
      .then(function(res){
        if(!res.ok) throw new Error("bad response");
        return res.json();
      })
      .then(renderPlays)
      .catch(showError);
  })();
</script>
</body>
</html>
