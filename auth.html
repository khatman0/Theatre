<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ورود / ثبت‌نام — کانون تئاتر دانشگاه نیشابور</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --night:#0E1B24;
    --night-2:#162A35;
    --turquoise:#3FBFB6;
    --turquoise-deep:#1B7E79;
    --ochre:#D9A62E;
    --paper:#F0ECE3;
    --ink:#1A242C;
    --ink-soft:#54636E;
    --rule:#D8D1C4;

    --bg:var(--paper);
    --fg:var(--ink);
    --fg-soft:var(--ink-soft);
    --panel:#FFFFFF;
    --line:var(--rule);
    --accent:var(--turquoise-deep);
    --accent-2:#9C7413;

    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#111A21;
      --fg:#E7E2D7;
      --fg-soft:#9BA9B2;
      --panel:#17232B;
      --line:#2A3A44;
      --accent:var(--turquoise);
      --accent-2:var(--ochre);
    }
  }
  :root[data-theme="dark"]{
    --bg:#111A21;--fg:#E7E2D7;--fg-soft:#9BA9B2;--panel:#17232B;--line:#2A3A44;
    --accent:var(--turquoise);--accent-2:var(--ochre);
  }
  *,*::before,*::after{box-sizing:inherit}
  html{scroll-padding-top:calc(4.2rem + env(safe-area-inset-top,0px));-webkit-text-size-adjust:100%;height:100%}
  body{
    margin:0;min-height:100%;
    background:var(--bg);color:var(--fg);
    font-family:Vazirmatn,"Segoe UI",Tahoma,sans-serif;
    font-size:17px;line-height:1.85;
  }
  a{color:inherit}
  .wrap{max-width:46rem;margin:0 auto;padding:0 1.25rem}

  /* ---------- نوار بالا ---------- */
  .topbar{
    position:sticky;top:0;z-index:40;
    padding-top:env(safe-area-inset-top,0px);
    background:var(--night);
    border-bottom:1px solid rgba(63,191,182,.35);
  }
  .topbar-inner{
    max-width:46rem;margin:0 auto;padding:0 1.1rem;
    height:3.6rem;display:flex;align-items:center;justify-content:space-between;
  }
  .brand{
    display:flex;align-items:center;gap:.55rem;
    text-decoration:none;color:#EAF4F3;
  }
  .brand .mark{
    width:1.9rem;height:1.9rem;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, var(--turquoise), var(--turquoise-deep) 70%);
    flex:none;
    box-shadow:inset 0 0 0 2px rgba(255,255,255,.15);
  }
  .brand span{
    font-family:Lalezar,sans-serif;font-size:1.25rem;line-height:1;
    letter-spacing:.01em;
  }
  .burger{
    appearance:none;border:0;background:transparent;
    width:2.6rem;height:2.6rem;border-radius:.5rem;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
    cursor:pointer;
  }
  .burger:hover{background:rgba(63,191,182,.12)}
  .burger span{
    width:22px;height:2px;background:var(--turquoise);border-radius:2px;
    transition:transform .25s ease, opacity .2s ease;
  }
  .burger[aria-expanded="true"] span:nth-child(1){transform:translateY(7px) rotate(45deg)}
  .burger[aria-expanded="true"] span:nth-child(2){opacity:0}
  .burger[aria-expanded="true"] span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}

  .backdrop{
    position:fixed;
    top:calc(3.6rem + env(safe-area-inset-top,0px));
    left:0;right:0;bottom:0;
    background:rgba(0,0,0,.4);
    opacity:0;pointer-events:none;
    transition:opacity .25s ease;
    z-index:38;
  }
  .backdrop[data-open="true"]{opacity:1;pointer-events:auto}

  #menu{
    position:fixed;
    top:calc(3.6rem + env(safe-area-inset-top,0px));
    bottom:0;left:0;
    width:min(78vw, 16rem);
    background:var(--night-2);
    border-left:1px solid rgba(63,191,182,.15);
    box-shadow:2px 0 18px rgba(0,0,0,.25);
    transform:translateX(-100%);
    transition:transform .28s ease;
    overflow-y:auto;
    z-index:39;
  }
  #menu[data-open="true"]{transform:translateX(0)}
  #menu ul{list-style:none;margin:0;padding:.6rem 0}
  #menu li a{
    display:block;padding:.9rem 1.1rem;color:#DCEFED;text-decoration:none;
    font-size:1.02rem;border-bottom:1px solid rgba(255,255,255,.06);
  }
  #menu li:last-child a{border-bottom:none}
  #menu li a[aria-current="page"]{color:var(--turquoise);font-weight:600}
  #menu li a:hover{color:var(--turquoise)}
  #menu li.menu-auth{border-top:1px solid rgba(63,191,182,.18);margin-top:.3rem}
  #menu li.menu-auth .menu-user{
    padding:.85rem 1.1rem .2rem;color:var(--turquoise);
    font-size:.8rem;word-break:break-all;
  }
  #menu li.menu-auth a{color:#DCEFED;padding-top:.35rem}

  /* ---------- سردَر ---------- */
  header.hero{
    background:var(--night);color:#EAF4F3;
    padding:2.6rem 0 2.6rem;position:relative;overflow:hidden;
    border-bottom:6px solid var(--turquoise-deep);
  }
  .tile{
    position:absolute;inset:0;
    background-image:
      linear-gradient(45deg, rgba(63,191,182,.10) 25%, transparent 25%, transparent 75%, rgba(63,191,182,.10) 75%),
      linear-gradient(45deg, rgba(217,166,46,.08) 25%, transparent 25%, transparent 75%, rgba(217,166,46,.08) 75%);
    background-size:72px 72px;background-position:0 0,36px 36px;opacity:.9;
  }
  .hero .wrap{position:relative}
  .eyebrow{color:var(--ochre);font-size:.92rem;margin:0 0 .5rem}
  h1{
    font-family:Lalezar,Vazirmatn,sans-serif;font-weight:400;
    font-size:clamp(2rem,8vw,3rem);line-height:1.15;margin:0;
    color:var(--turquoise);text-shadow:0 2px 0 rgba(0,0,0,.35);
  }
  .hero p.sub{margin:.8rem 0 0;font-size:1.02rem;color:#BFD6D4;max-width:30rem}

  main{padding:2.8rem 0 4rem}
  p{margin:0 0 1rem}

  /* ---------- کارت ورود/ثبت‌نام ---------- */
  .auth-card{
    background:var(--panel);border:1px solid var(--line);
    max-width:26rem;margin:0 auto;
    padding:1.6rem 1.5rem 1.8rem;
  }
  .tabs{
    display:flex;border:1px solid var(--line);border-radius:.5rem;
    overflow:hidden;margin:0 0 1.4rem;
  }
  .tabs button{
    flex:1;appearance:none;border:0;background:var(--bg);color:var(--fg-soft);
    padding:.65rem .5rem;font-family:inherit;font-size:.95rem;cursor:pointer;
    transition:background .15s ease,color .15s ease;
  }
  .tabs button[aria-selected="true"]{
    background:var(--turquoise-deep);color:#F4FBFA;font-weight:600;
  }

  form{display:none}
  form.is-active{display:block}
  label{
    display:block;font-size:.9rem;color:var(--fg-soft);margin:0 0 .3rem;
  }
  input[type="email"],input[type="password"],input[type="text"]{
    width:100%;padding:.65rem .8rem;margin:0 0 1rem;
    border:1px solid var(--line);border-radius:.4rem;
    background:var(--bg);color:var(--fg);
    font-family:inherit;font-size:.98rem;
  }
  input:focus-visible{outline:3px solid var(--turquoise);outline-offset:1px}
  .submit-btn{
    width:100%;appearance:none;border:0;border-radius:.4rem;
    background:var(--turquoise-deep);color:#F4FBFA;
    padding:.75rem 1rem;font-family:inherit;font-size:1rem;font-weight:600;
    cursor:pointer;transition:background .18s ease;
  }
  .submit-btn:hover{background:var(--turquoise)}
  .submit-btn:disabled{opacity:.6;cursor:default}

  .hint{font-size:.82rem;color:var(--fg-soft);margin:.5rem 0 0}

  .alert{
    margin:0 0 1.1rem;padding:.7rem .9rem;border-radius:.4rem;
    font-size:.9rem;display:none;
  }
  .alert.is-visible{display:block}
  .alert.is-error{background:rgba(192,82,74,.12);color:#C0524A;border:1px solid rgba(192,82,74,.35)}
  .alert.is-success{background:rgba(63,191,182,.12);color:var(--accent);border:1px solid rgba(63,191,182,.35)}

  .signed-in-box{
    max-width:26rem;margin:0 auto;text-align:center;
    background:var(--panel);border:1px solid var(--line);
    padding:2rem 1.5rem;
  }
  .signed-in-box .email{color:var(--accent);font-weight:600}
  .signed-in-box .cta{
    display:inline-flex;margin-top:1.1rem;
    background:var(--turquoise-deep);color:#F4FBFA;
    text-decoration:none;padding:.65rem 1.3rem;border-radius:.4rem;
    font-size:.95rem;
  }
  .signed-in-box .cta:hover{background:var(--turquoise)}

  footer{
    border-top:1px solid var(--line);
    padding:1.6rem 0 calc(2.2rem + env(safe-area-inset-bottom,0px));
    color:var(--fg-soft);font-size:.88rem;text-align:center;
  }
  :focus-visible{outline:3px solid var(--turquoise);outline-offset:2px}
  @media (prefers-reduced-motion: reduce){
    .burger span,#menu,.backdrop{transition:none}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="index.html">
      <span class="mark" aria-hidden="true"></span>
      <span>کانون تئاتر نیشابور</span>
    </a>
    <button class="burger" id="burgerBtn" aria-expanded="false" aria-controls="menu" aria-label="باز کردن منو">
      <span></span><span></span><span></span>
    </button>
  </div>
  <nav id="menu" data-open="false">
    <ul>
      <li><a href="index.html">خانه</a></li>
      <li><a href="plays.html">نمایشنامه‌ها</a></li>
      <li class="menu-auth" id="authMenuItem"><a href="auth.html" aria-current="page">ورود / ثبت‌نام</a></li>
    </ul>
  </nav>
</div>
<div class="backdrop" id="backdrop" data-open="false"></div>

<header class="hero">
  <div class="tile" aria-hidden="true"></div>
  <div class="wrap">
    <p class="eyebrow">حساب کاربری</p>
    <h1>ورود به کانون</h1>
    <p class="sub">برای ورود یا ساختن حساب، ایمیل و رمز عبورت رو وارد کن.</p>
  </div>
</header>

<main class="wrap">

  <div id="signedOutView">
    <div class="auth-card">
      <div class="tabs" role="tablist">
        <button type="button" id="tabLogin" role="tab" aria-selected="true">ورود</button>
        <button type="button" id="tabSignup" role="tab" aria-selected="false">ثبت‌نام</button>
      </div>

      <div class="alert" id="alertBox"></div>

      <form id="loginForm" class="is-active">
        <label for="loginEmail">ایمیل</label>
        <input type="email" id="loginEmail" autocomplete="email" required>
        <label for="loginPassword">رمز عبور</label>
        <input type="password" id="loginPassword" autocomplete="current-password" required>
        <button type="submit" class="submit-btn" id="loginBtn">ورود</button>
      </form>

      <form id="signupForm">
        <label for="signupEmail">ایمیل</label>
        <input type="email" id="signupEmail" autocomplete="email" required>
        <label for="signupPassword">رمز عبور</label>
        <input type="password" id="signupPassword" autocomplete="new-password" minlength="6" required>
        <p class="hint">حداقل ۶ کاراکتر.</p>
        <button type="submit" class="submit-btn" id="signupBtn">ساختن حساب</button>
      </form>
    </div>
  </div>

  <div id="signedInView" style="display:none">
    <div class="signed-in-box">
      <p>وارد شدی با</p>
      <p class="email" id="userEmail"></p>
      <a class="cta" href="index.html">رفتن به خانه ←</a>
    </div>
  </div>

</main>

<footer class="wrap">
  <p>کانون تئاتر دانشگاه نیشابور</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  (function(){
    var btn = document.getElementById('burgerBtn');
    var menu = document.getElementById('menu');
    var backdrop = document.getElementById('backdrop');
    function setOpen(open){
      menu.setAttribute('data-open', String(open));
      backdrop.setAttribute('data-open', String(open));
      btn.setAttribute('aria-expanded', String(open));
    }
    btn.addEventListener('click', function(){
      setOpen(menu.getAttribute('data-open') !== 'true');
    });
    backdrop.addEventListener('click', function(){ setOpen(false); });
    document.addEventListener('keydown', function(e){
      if(e.key === 'Escape'){ setOpen(false); }
    });
  })();

  (function(){
    var SUPABASE_URL = "https://giskluyvwinuyqlgdfuw.supabase.co";
    var SUPABASE_ANON_KEY = "sb_publishable_rInivX8hSrSzWNEeMiMbsw_cNEyJxrh";
    var sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    window.sbClient = sb;

    var authItem = document.getElementById('authMenuItem');
    var signedOutView = document.getElementById('signedOutView');
    var signedInView = document.getElementById('signedInView');
    var userEmailEl = document.getElementById('userEmail');

    var tabLogin = document.getElementById('tabLogin');
    var tabSignup = document.getElementById('tabSignup');
    var loginForm = document.getElementById('loginForm');
    var signupForm = document.getElementById('signupForm');
    var alertBox = document.getElementById('alertBox');
    var loginBtn = document.getElementById('loginBtn');
    var signupBtn = document.getElementById('signupBtn');

    function escapeHtml(str){
      return String(str == null ? "" : str).replace(/[&<>"']/g, function(c){
        return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
      });
    }

    function showAlert(message, type){
      alertBox.textContent = message;
      alertBox.className = "alert is-visible " + (type === "error" ? "is-error" : "is-success");
    }
    function hideAlert(){
      alertBox.className = "alert";
      alertBox.textContent = "";
    }

    function switchTab(which){
      hideAlert();
      var loginActive = which === "login";
      tabLogin.setAttribute('aria-selected', String(loginActive));
      tabSignup.setAttribute('aria-selected', String(!loginActive));
      loginForm.classList.toggle('is-active', loginActive);
      signupForm.classList.toggle('is-active', !loginActive);
    }
    tabLogin.addEventListener('click', function(){ switchTab('login'); });
    tabSignup.addEventListener('click', function(){ switchTab('signup'); });

    function renderAuthState(session){
      if(authItem){
        if(session && session.user){
          authItem.innerHTML =
            '<div class="menu-user">' + escapeHtml(session.user.email) + '</div>' +
            '<a href="#" id="logoutLink">خروج</a>';
          document.getElementById('logoutLink').addEventListener('click', function(e){
            e.preventDefault();
            sb.auth.signOut().then(function(){ window.location.reload(); });
          });
        } else {
          authItem.innerHTML = '<a href="auth.html" aria-current="page">ورود / ثبت‌نام</a>';
        }
      }

      if(session && session.user){
        signedOutView.style.display = "none";
        signedInView.style.display = "block";
        userEmailEl.textContent = session.user.email;
      } else {
        signedOutView.style.display = "block";
        signedInView.style.display = "none";
      }
    }

    sb.auth.getSession().then(function(res){ renderAuthState(res.data.session); });
    sb.auth.onAuthStateChange(function(_event, session){ renderAuthState(session); });

    loginForm.addEventListener('submit', function(e){
      e.preventDefault();
      hideAlert();
      loginBtn.disabled = true;
      loginBtn.textContent = "در حال ورود…";
      var email = document.getElementById('loginEmail').value.trim();
      var password = document.getElementById('loginPassword').value;

      sb.auth.signInWithPassword({ email: email, password: password })
        .then(function(res){
          if(res.error){
            showAlert(res.error.message === "Invalid login credentials"
              ? "ایمیل یا رمز عبور اشتباهه."
              : res.error.message, "error");
            return;
          }
          window.location.href = "index.html";
        })
        .catch(function(){
          showAlert("مشکلی پیش اومد. دوباره امتحان کن.", "error");
        })
        .finally(function(){
          loginBtn.disabled = false;
          loginBtn.textContent = "ورود";
        });
    });

    signupForm.addEventListener('submit', function(e){
      e.preventDefault();
      hideAlert();
      signupBtn.disabled = true;
      signupBtn.textContent = "در حال ساختن حساب…";
      var email = document.getElementById('signupEmail').value.trim();
      var password = document.getElementById('signupPassword').value;

      sb.auth.signUp({ email: email, password: password })
        .then(function(res){
          if(res.error){
            showAlert(res.error.message, "error");
            return;
          }
          if(res.data.session){
            window.location.href = "index.html";
          } else {
            showAlert("حساب ساخته شد. یه ایمیل تأیید برات فرستادیم؛ روی لینک توش بزن، بعد وارد شو.", "success");
            signupForm.reset();
          }
        })
        .catch(function(){
          showAlert("مشکلی پیش اومد. دوباره امتحان کن.", "error");
        })
        .finally(function(){
          signupBtn.disabled = false;
          signupBtn.textContent = "ساختن حساب";
        });
    });
  })();
</script>
</body>
</html>
